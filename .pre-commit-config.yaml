# Run with prek (fast Rust drop-in for pre-commit): `prek install`, `prek run --all-files`.
# Standard pre-commit config format; prek reads it unchanged.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        files: \.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # dprint and oxlint run from the mise-managed/project-local binaries so the
  # versions match local dev and CI.
  - repo: local
    hooks:
      - id: dprint-fmt
        name: dprint fmt
        entry: dprint fmt
        language: system
        pass_filenames: false
        files: \.(astro|ts|tsx|js|mjs|css|md|json|jsonc|toml|ya?ml)$

      - id: oxlint
        name: oxlint
        entry: ./node_modules/.bin/oxlint --max-warnings 0
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|mjs)$
